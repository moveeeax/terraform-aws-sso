name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.8
          tofu_wrapper: false

      - name: fmt
        run: tofu fmt -check -recursive

      - name: init
        run: tofu init -backend=false

      - name: validate
        run: tofu validate

      - name: validate example
        working-directory: examples/basic
        run: |
          tofu init -backend=false
          tofu validate

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The test suite uses mock_provider, so it needs Terraform >= 1.7 even
      # though the module itself supports >= 1.5.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: init
        run: terraform init -backend=false

      - name: test
        run: terraform test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.65.0

      # --recursive re-reads config per directory, so point every pass at the
      # repo-root .tflint.hcl explicitly.
      - name: tflint
        env:
          TFLINT_CONFIG_FILE: ${{ github.workspace }}/.tflint.hcl
        run: |
          tflint --init
          tflint --recursive
